name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Pack npm artifact
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
      - name: Archive distribution files
        run: zip -r release/runtime-expression-dist.zip dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/runtime-expression.js
            dist/composition.js
            dist/types/*.d.ts
            release/*.tgz
            release/runtime-expression-dist.zip
